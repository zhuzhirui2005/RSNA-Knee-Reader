[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-reader"
version = "0.1.0"
description = "Read server-side knee MRI reports and paginated DICOM images through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RSNA Knee Reader contributors"}]
dependencies = [
  "mcp>=2.3,<3",
  "pydicom>=3,<4",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1"]
compressed = ["pylibjpeg>=2", "pylibjpeg-libjpeg>=2", "pylibjpeg-openjpeg>=2"]

[project.scripts]
rsna-knee-reader = "rsna_knee_reader.cli:main"

[project.urls]
Repository = "https://github.com/zhuzhirui2005/rsna-knee-reader"
Issues = "https://github.com/zhuzhirui2005/rsna-knee-reader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
